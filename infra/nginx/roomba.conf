# /etc/nginx/sites-available/roomba
#
# Nginx hace tres cosas: sirve el frontend compilado, hace de proxy a la API y deja pasar
# el WebSocket. Certbot añade el bloque TLS al ejecutar `certbot --nginx`.

server {
    listen 80;
    server_name tu-dominio.com;

    # Certbot sustituye esto por una redirección a HTTPS. Mientras tanto, para el reto
    # de validación inicial, deja pasar .well-known.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tu-dominio.com;

    # ssl_certificate / ssl_certificate_key los rellena Certbot.

    root /srv/iot/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los assets de Vite llevan hash en el nombre: cachearlos un año es seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: cualquier ruta que no sea un archivo cae en index.html.
    # Sin esto, recargar en /sesiones da un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket. Las cabeceras Upgrade/Connection son obligatorias: sin ellas el handshake
    # falla y Socket.IO se queda haciendo polling (o no conecta).
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Una conexión en vivo puede pasar minutos sin tráfico del cliente; el timeout por
        # defecto (60 s) la cortaría.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
