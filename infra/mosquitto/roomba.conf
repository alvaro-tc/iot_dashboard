# /etc/mosquitto/conf.d/roomba.conf
#
# Dos listeners con propósitos distintos:
#   8883  TLS, de cara a internet: por aquí entran los robots.
#   1883  solo en 127.0.0.1: por aquí habla el backend, que corre en la misma máquina.
#
# El 1883 NO se abre en el cortafuegos. Si se expusiera, cualquiera podría publicar
# telemetría sin cifrar con las credenciales de un robot capturadas en la red.

# --- Robots (TLS) ---
listener 8883 0.0.0.0
protocol mqtt
certfile /etc/mosquitto/certs/fullchain.pem
keyfile  /etc/mosquitto/certs/privkey.pem
# TLS 1.2 como mínimo: el ESP32 con MicroPython lo soporta de sobra.
tls_version tlsv1.2
# Los robots no presentan certificado de cliente; se autentican con usuario y contraseña.
require_certificate false

# --- Backend (solo local) ---
listener 1883 127.0.0.1
protocol mqtt

# --- Autenticación ---
allow_anonymous false
# Ambos archivos los genera y mantiene apps/api/src/mqtt/broker-credentials.ts.
# Mosquitto los relee con SIGHUP (systemctl reload) sin cortar las conexiones existentes.
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# --- Persistencia ---
persistence true
persistence_location /var/lib/mosquitto/
# Los mensajes retenidos (`estado` y `config`) sobreviven a un reinicio del broker.
autosave_interval 300

# --- Límites para un VPS pequeño ---
# Un robot desconectado no debe acumular una cola que se coma la RAM: con QoS 0 en la
# telemetría, los mensajes viejos no sirven de nada cuando vuelva.
max_queued_messages 200
max_inflight_messages 20
message_size_limit 65536
max_connections 200

# --- Registro ---
log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true
