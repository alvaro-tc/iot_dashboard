# Lo arranca el contenedor de docker-compose.yml: monta ./mosquitto en /mosquitto/config
# (de ahí busca este archivo) y un volumen aparte en /mosquitto/data para la persistencia.
# Las rutas de abajo son absolutas DENTRO del contenedor porque el proceso arranca con cwd "/",
# no con la carpeta que lo contiene: una ruta relativa "mosquitto/passwd" no encontraría el
# archivo, que en el contenedor vive en /mosquitto/config/passwd.
listener 1883 0.0.0.0
allow_anonymous false

# Ambos archivos los genera y mantiene apps/api/src/mqtt/broker-credentials.ts, en el host
# (./mosquitto/passwd y ./mosquitto/acl); el contenedor los relee con SIGHUP tras cada cambio.
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
