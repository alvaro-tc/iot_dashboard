# Arráncalo desde la raíz del repo: mosquitto -c mosquitto/mosquitto.conf
# (las rutas de abajo son relativas al directorio de trabajo).
listener 1883 0.0.0.0
allow_anonymous false

# Ambos archivos los genera y mantiene apps/api/src/mqtt/broker-credentials.ts.
password_file mosquitto/passwd
acl_file mosquitto/acl

persistence true
persistence_location mosquitto/
log_dest stdout
